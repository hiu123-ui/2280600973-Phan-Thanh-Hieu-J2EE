<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Book Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <!-- ================= CSS GỘP ================= -->
    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Glass Card */
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            color: white;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .login-title span {
            color: #00ffd5;
        }

        .form-control {
            border-radius: 30px;
            padding: 12px 18px;
            border: none;
        }

        .form-control:focus {
            box-shadow: 0 0 10px #00ffd5;
        }

        .btn-login {
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #fc00ff;
        }

        .btn-google {
            background: #db4437;
            color: white;
            border-radius: 30px;
            padding: 12px;
            font-weight: bold;
        }

        .btn-google:hover {
            background: #c23321;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .register-link {
            color: #00ffd5;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="login-title mb-2">
        Login to <span>Bookstore</span>
    </div>

    <p class="text-center text-light mb-4">
        Enter your username and password
    </p>

    <!-- ERROR -->
    <div th:if="${param.error}" class="alert alert-danger text-center">
        Invalid username or password!
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center">
        Logged out successfully!
    </div>

    <!-- FORM -->
    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <input type="text"
                   class="form-control"
                   name="username"
                   placeholder="Username"
                   required>
        </div>

        <div class="mb-3">
            <input type="password"
                   class="form-control"
                   name="password"
                   placeholder="Password"
                   required>
        </div>

        <div class="remember mb-3">
            <input type="checkbox" name="remember-me">
            <label>Remember me</label>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </div>

        <div class="text-center mb-3">
            Don't have an account?
            <a th:href="@{/register}" class="register-link">Sign up</a>
        </div>

        <div class="d-grid">
            <a href="/oauth2/authorization/google" class="btn btn-google">
                <i class="fa-brands fa-google"></i> Login with Google
            </a>
        </div>

    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
