<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUTECH Book Store</title>

    <th:block th:fragment="link-css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </th:block>

    <th:block th:fragment="custom-css">
        <style>
            /* Áp dụng Font Poppins cho toàn trang */
            body {
                font-family: 'Poppins', sans-serif;
                background-color: #f8f9fa; /* Màu nền xám nhẹ dịu mắt */
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* Gradient Navbar */
            .navbar-custom {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                padding: 1rem 0;
            }
            .navbar-custom .navbar-brand,
            .navbar-custom .nav-link {
                color: rgba(255, 255, 255, 0.9) !important;
                font-weight: 500;
                transition: all 0.3s;
            }
            .navbar-custom .nav-link:hover {
                color: #fff !important;
                transform: translateY(-2px);
                text-shadow: 0 0 10px rgba(255,255,255,0.5);
            }
            .navbar-custom .navbar-toggler {
                border-color: rgba(255,255,255,0.5);
            }
            .navbar-custom .navbar-toggler-icon {
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.9%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
            }

            /* Badge số lượng Cart (nếu có) */
            .nav-link .badge {
                background-color: #ff6b6b;
                color: white;
            }

            /* User Info Box trong Navbar */
            .user-info-box {
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(5px);
                border-radius: 30px;
                padding: 5px 15px;
                display: flex;
                align-items: center;
                color: white;
            }

            /* Footer Styles */
            .footer-custom {
                background-color: #343a40;
                color: #adb5bd;
                margin-top: auto; /* Đẩy footer xuống đáy */
                padding: 1.5rem 0;
            }
            .footer-custom a {
                color: #fff;
                text-decoration: none;
            }
        </style>
    </th:block>

</head>

<body>

    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold fs-4" href="/">
                    <i class="fas fa-book-reader me-2"></i>HUTECH BOOK
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','USER')">
                            <a class="nav-link" href="/books"><i class="fas fa-list me-1"></i> List Books</a>
                        </li>

                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" href="/books/add"><i class="fas fa-plus-circle me-1"></i> Add Book</a>
                        </li>

                        <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','USER')">
                            <a class="nav-link position-relative" href="/cart">
                                <i class="fas fa-shopping-cart me-1"></i> Cart
                                </a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        
                        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                            <div class="user-info-box">
                                <i class="fas fa-user-circle fa-lg me-2"></i>
                                <span>
                                    Hi, <b sec:authentication="name">User</b>
                                    </span>
                            </div>

                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button class="btn btn-outline-light btn-sm rounded-pill px-3" type="submit">
                                    Logout <i class="fas fa-sign-out-alt ms-1"></i>
                                </button>
                            </form>
                        </div>

                        <a sec:authorize="!isAuthenticated()" class="btn btn-light rounded-pill px-4 fw-bold text-primary" href="/login">
                            Login <i class="fas fa-sign-in-alt ms-1"></i>
                        </a>

                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        </div>

    <footer th:fragment="footer" class="footer-custom">
        <div class="container text-center">
            <p class="mb-1">
                Copyright &copy; <span th:text="${#dates.year(#dates.createNow())}"></span> 
                <strong>HUTECH University</strong>. All Rights Reserved.
            </p>
            <small>
                Designed for <a href="https://www.hutech.edu.vn/" class="text-decoration-underline">Java Technology Class</a>
            </small>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    </footer>

</body>
</html>
