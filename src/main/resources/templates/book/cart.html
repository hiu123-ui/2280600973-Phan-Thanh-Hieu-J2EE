<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    
    <th:block th:replace="~{layout::link-css}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <th:block th:replace="~{layout::custom-css}"></th:block>

    <style>
        /* CSS Riêng cho Cart */
        .cart-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        
        /* Table Style */
        .table-custom thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .table-custom th {
            font-weight: 500;
            border: none;
            padding: 15px;
        }
        .table-custom td {
            vertical-align: middle;
            padding: 15px;
        }
        
        /* Summary Box bên phải */
        .summary-card {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 20px; /* Để box này trượt theo khi scroll */
        }
        
        .btn-checkout {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
            color: white;
        }
        
        .quantity-input {
            width: 70px;
            text-align: center;
            border-radius: 20px;
            border: 1px solid #ced4da;
        }
        
        .empty-cart-icon {
            font-size: 5rem;
            color: #d1d1d1;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="bg-light">
    
    <th:block th:replace="~{layout::header}"></th:block>
    
    <div class="container mt-5 mb-5">
        
        <h2 class="mb-4 fw-bold text-dark"><i class="fas fa-shopping-cart me-2"></i>Your Shopping Cart</h2>

        <div class="row" th:if="${not #lists.isEmpty(cart.cartItems)}">
            
            <div class="col-lg-8 mb-4">
                <div class="card cart-card">
                    <div class="table-responsive">
                        <table class="table table-custom mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">Book Info</th>
                                    <th scope="col" class="text-center">Price</th>
                                    <th scope="col" class="text-center">Qty</th>
                                    <th scope="col" class="text-center">Total</th>
                                    <th scope="col" class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cart.cartItems}">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="bg-light rounded p-2 me-3 text-primary">
                                                <i class="fas fa-book fa-lg"></i>
                                            </div>
                                            <div>
                                                <h6 class="mb-0 fw-bold" th:text="${item.getBookName()}">Book Name</h6>
                                                <small class="text-muted">ID: <span th:text="${item.getBookId()}"></span></small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-center" th:text="${item.getPrice()}"></td>
                                    <td class="text-center">
                                        <input type="number" min="1" th:value="${item.getQuantity()}"
                                               th:attr="data-id=${item.getBookId()}" 
                                               class="form-control quantity quantity-input mx-auto">
                                    </td>
                                    <td class="text-center fw-bold text-primary" 
                                        th:text="${item.getPrice() * item.getQuantity()}"></td>
                                    <td class="text-center">
                                        <a class="btn btn-outline-danger btn-sm rounded-circle" 
                                           th:href="@{/cart/removeFromCart/{id}(id=${item.getBookId()})}"
                                           title="Remove item">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="mt-3">
                     <a class="btn btn-link text-danger text-decoration-none" th:href="@{/cart/clearCart}">
                        <i class="fas fa-trash me-1"></i> Clear Shopping Cart
                     </a>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="summary-card">
                    <h5 class="fw-bold mb-4">Cart Summary</h5>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-bold" th:text="${totalPrice}">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Tax (VAT)</span>
                        <span>$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="h5 fw-bold">Total</span>
                        <span class="h5 fw-bold text-primary" th:text="${totalPrice}">$0.00</span>
                    </div>
                    
                    <a class="btn btn-checkout" th:href="@{/cart/checkout}">
                        Proceed to Checkout <i class="fas fa-arrow-right ms-2"></i>
                    </a>
                    
                    <div class="mt-3 text-center">
                        <a href="/books" class="text-muted text-decoration-none small">
                            <i class="fas fa-arrow-left me-1"></i> Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="container" th:if="${#lists.isEmpty(cart.cartItems)}">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center py-5">
                    <div class="empty-cart-icon">
        
                        <i class="fas fa-shopping-basket"></i>
                    </div>
                    <h3 class="fw-bold">Your cart is empty</h3>
                    <p class="text-muted mb-4">Looks like you haven't added any books to your cart yet.</p>
                    <a class="btn btn-checkout w-50 mx-auto" href="/books">
                        Start Shopping
                    </a>
                </div>
            </div>
        </div>
        
    </div>

    <th:block th:replace="~{layout::footer}"></th:block>
    <script th:src="@{/js/cart.js}"></script>
</body>

</html>
