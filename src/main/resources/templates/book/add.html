<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book | Book Management</title>
    
    <th:block th:replace="~{layout::link-css}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <th:block th:replace="~{layout::custom-css}"></th:block>

    <style>
        /* CSS Riêng để đồng bộ với trang chủ */
        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden; /* Để bo góc header không bị lòi ra */
        }
        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            transition: transform 0.2s;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
            color: white;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        .form-label {
            font-weight: 600;
            color: #555;
        }
    </style>
</head>

<body class="bg-light"> <th:block th:replace="~{layout::header}"></th:block>
    
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8"> <div class="card form-card">
                    <div class="form-header">
                        <h3 class="mb-0"><i class="fas fa-book-medical me-2"></i>Add New Book</h3>
                        <small>Enter book details below</small>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/books/add}" th:object="${book}" method="post">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="title">Title <span class="text-danger">*</span></label>
                                    <input class="form-control" type="text" placeholder="Enter book title" 
                                           th:field="*{title}" id="title" required autofocus>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="author">Author</label>
                                    <input class="form-control" type="text" th:field="*{author}" 
                                           id="author" placeholder="Enter author name">
                                    <span class="text-danger small" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="price">Price <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input class="form-control" required type="number" step="0.01" 
                                               th:field="*{price}" id="price" placeholder="0.00">
                                    </div>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="category">Category <span class="text-danger">*</span></label>
                                    <select class="form-select" id="category" name="category.id"> <option value="">-- Select Category --</option>
                                        <option th:each="category : ${categories}" th:value="${category.getId()}"
                                            th:text="${category.getName()}"></option>
                                    </select>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a th:href="@{/books}" class="btn btn-outline-secondary me-md-2">
                                    <i class="fas fa-arrow-left"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-gradient">
                                    <i class="fas fa-save"></i> Save Book
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <th:block th:replace="~{layout::footer}"></th:block>
</body>

</html>
