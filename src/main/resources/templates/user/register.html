<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Book Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <!-- ================= CSS GỘP ================= -->
    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Glass Card */
        .register-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            color: white;
            width: 100%;
            max-width: 450px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .register-title span {
            color: #00ffd5;
        }

        .form-control {
            border-radius: 30px;
            padding: 12px 18px;
            border: none;
        }

        .form-control:focus {
            box-shadow: 0 0 10px #00ffd5;
        }

        .btn-register {
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }

        .btn-register:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #fc00ff;
        }

        .login-link {
            color: #00ffd5;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .error-box {
            background: rgba(255,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="register-card">

    <div class="register-title mb-2">
        Sign up to <span>Bookstore</span>
    </div>

    <p class="text-center text-light mb-4">
        Welcome! Create your account
    </p>

    <!-- ERROR LIST -->
    <div th:if="${errors}" class="error-box">
        <ul>
            <li th:each="error : ${errors}"
                th:text="${error}">
            </li>
        </ul>
    </div>

    <!-- FORM -->
    <form th:action="@{/register}" method="post">

        <div class="mb-3">
            <input type="email"
                   class="form-control"
                   name="email"
                   placeholder="Email"
                   required>
        </div>

        <div class="mb-3">
            <input type="text"
                   class="form-control"
                   name="username"
                   placeholder="Username"
                   required>
        </div>

        <div class="mb-3">
            <input type="password"
                   class="form-control"
                   name="password"
                   placeholder="Password"
                   required>
        </div>

        <div class="mb-3">
            <input type="tel"
                   class="form-control"
                   name="phone"
                   placeholder="Phone number"
                   required>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-register">
                <i class="fa-solid fa-user-plus"></i> Sign up
            </button>
        </div>

        <div class="text-center">
            Already have an account?
            <a th:href="@{/login}" class="login-link">Login</a>
        </div>

    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
