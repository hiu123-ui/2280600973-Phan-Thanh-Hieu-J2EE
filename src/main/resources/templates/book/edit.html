<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book Details</title>
    
    <th:block th:replace="~{layout::link-css}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <th:block th:replace="~{layout::custom-css}"></th:block>

    <style>
        /* CSS dùng chung (Copy từ trang Add Book sang để đồng bộ) */
        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            transition: transform 0.2s;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
            color: white;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>

<body class="bg-light">
    
    <th:block th:replace="~{layout::header}"></th:block>
    
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card form-card">
                    <div class="form-header">
                        <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Book Details</h3>
                        <small>Update information for ID: <span th:text="${book.id}"></span></small>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/books/edit}" th:object="${book}" method="post">
                            
                            <input type="hidden" th:field="*{id}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold" for="title">Title <span class="text-danger">*</span></label>
                                    <input class="form-control" type="text" th:field="*{title}" id="title" required>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold" for="author">Author</label>
                                    <input class="form-control" type="text" th:field="*{author}" id="author">
                                    <span class="text-danger small" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold" for="price">Price <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input class="form-control" type="number" step="0.01" th:field="*{price}" id="price">
                                    </div>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold" for="category">Category <span class="text-danger">*</span></label>
                                    <select class="form-select" id="category" name="category.id" th:field="*{category.id}">
                                        <option value="">-- Select Category --</option>
                                        <option th:each="category : ${categories}" 
                                                th:value="${category.getId()}"
                                                th:text="${category.getName()}">
                                        </option>
                                    </select>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a th:href="@{/books}" class="btn btn-outline-secondary me-md-2">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-gradient">
                                    <i class="fas fa-check"></i> Update Changes
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <th:block th:replace="~{layout::footer}"></th:block>
</body>

</html>
